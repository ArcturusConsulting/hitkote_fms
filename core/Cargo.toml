[package]
name = "issem-core"
version = "0.1.0"
edition = "2021"

[dependencies]
zenoh = "1.9"
tokio = { version = "1.47", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.8"
redis = { version = "0.26", features = ["tokio-comp", "aio", "connection-manager"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "issem-core"
path = "src/main.rs"

[[bin]]
name = "mock_robot"
path = "src/bin/mock_robot.rs"