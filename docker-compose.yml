version: '3.8'

services:
  # --- Redis State Store ---
  redis:
    image: redis:7-alpine
    container_name: issem-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- ISSEM FMS Core Service ---
  issem-core:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: issem-core
    environment:
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=debug
    ports:
      - "7447:7447" # Zenoh default unicast/peer port
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
    driver: local